<!DOCTYPE html>
  <html>
    <head>
      <title>Drafty</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/png" href="images/drafty logo.png">
      <link rel="stylesheet" href="css/intial.css">
    </head>
      <body>

        <div class="main-header">
        <div class="header-content">
          <img src="./images/drafty logo.png" alt="Drafty" class="logo-img js-logo-img">
          <h1 class="drafty-header js-drafty-header">Drafty</h1>

        </div>
        </div>
   
        
        <div id="auth-modal" class="auth-overlay">
          <div class="auth-container">
               <h2 class="login-header">Welcome back!</h2>
            <input type="email" id="auth-email" placeholder="Email" class="input-email">
            <input type="password" id="auth-password" placeholder="Password" class="input-passwd">
              <button id="login-btn" class="input-login">Login</button>
              <button id="signup-btn" class="input-signup">Sign up</button>
          <p id="auth-error" style="color:red;"></p>

          </div>

        </div>
        <div id="main-app" class="main-overlay">
        <div class="side-container">
          <div class="side-header js-side-header">
          My Notes
          <button class="side-header-button js-side-header-button">&lt;</button>
         </div>
         <div class="side-bar js-side-bar">
        </div>
        </div>
        
        <main class="content-container">
          <div class="notepads-controls-top">
            <button class="logout-btn" id="logout-btn">Logout</button>
            <input placeholder="Title" class="notes-title js-notes-title">
            <div class="button-group">
              <button class="clear-button js-clear-button">Clear</button>
              <button class="save-button js-save-button">Save</button>
           </div>
          </div>

          <textarea class="note-pad js-note-pad" placeholder="Start typing your notes...."></textarea>
          
          <div class="notepads-control-bottom">
             <button class="delete-button js-delete-button">Delete</button>
          </div>
        </main>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/intial.js" type="module"></script>
        <script src="js/storage.js" type="module"></script>
        <script src="js/auth.js" type="module"></script>
        <script src="js/buttons.js" type="module"></script>
      </body>
  </html>
