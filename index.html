<!DOCTYPE html>
  <html>
    <head>
      <title>Drafty</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device", intial-scale="1.0">
      <link rel="stylesheet" href="css/intial.css">
    </head>
      <body>

        <div class="main-header">
          <h1 class="drafty-header js-drafty-header">Drafty</h1>
        </div>
        <div class="side-header js-side-header">
          My Notes
          <button class="side-header-button js-side-header-button">&lt;</button>
        </div>
        <div class="side-bar js-side-bar">
         
        </div>
        <main class="content-container">
          <input placeholder="Title" class="notes-title js-notes-title">
          <button class="save-button js-save-button">Save</button>
          <textarea class="note-pad js-note-pad" placeholder="Start typing your notes...."></textarea>
        </main>
        <script src="js/intial.js" type="module"></script>
        <script src="js/storage.js" type="module"></script>
      </body>
  </html>
